<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TourTok Tools</title>
  <style>
    :root{
      --bg:#0b0f17;
      --panel:#111827;
      --line:#243041;
      --text:#e5e7eb;
      --muted:#9ca3af;
      --accent:#60a5fa;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background: linear-gradient(180deg, var(--bg), #070a10);
      color:var(--text);
      padding:24px;
    }
    .card{
      width:min(520px, 100%);
      background: rgba(17,24,39,0.72);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }
    .brand{
      display:flex;
      gap:12px;
      align-items:center;
      margin-bottom:14px;
    }
    .logo{
      width:52px;
      height:52px;
      border-radius:14px;
      overflow:hidden;
      border:1px solid rgba(96,165,250,0.35);
      background: rgba(96,165,250,0.12);
      display:grid;
      place-items:center;
    }
    .logo img{
      width:100%;
      height:100%;
      object-fit:contain;
      display:block;
      background:#fff;
    }
    h1{
      margin:0;
      font-size:20px;
      line-height:1.2;
      letter-spacing:-.02em;
    }
    p{
      margin:4px 0 0 0;
      color:var(--muted);
      font-size:13px;
      line-height:1.4;
    }
    .buttons{
      display:grid;
      gap:10px;
      margin-top:16px;
    }
    a.btn{
      display:flex;
      justify-content:space-between;
      align-items:center;
      text-decoration:none;
      color:var(--text);
      font-weight:650;
      padding:14px 14px;
      border-radius:14px;
      border:1px solid rgba(96,165,250,0.35);
      background: rgba(96,165,250,0.18);
      transition: .15s ease;
    }
    a.btn:hover{ background: rgba(96,165,250,0.28); }
    a.btn.secondary{
      border:1px solid var(--line);
      background: rgba(255,255,255,0.05);
    }
    a.btn.secondary:hover{ background: rgba(255,255,255,0.08); }
    .arrow{ opacity:.8; }
    .foot{
      margin-top:14px;
      font-size:12px;
      color:var(--muted);
    }
    code{
      background: rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.08);
      padding:2px 6px;
      border-radius:8px;
      color:var(--text);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="logo">
        <img src="./LogoD.jpg" alt="TourTok" />
      </div>
      <div>
        <h1>TourTok Tools</h1>
        <p>Choose a tool to generate a PDF.</p>
      </div>
    </div>

    <div class="buttons">
      <a class="btn" href="/invoice">
        Invoice Generator <span class="arrow">→</span>
      </a>
      <a class="btn secondary" href="/voucher">
        Voucher Generator <span class="arrow">→</span>
      </a>
    </div>

    <div class="foot">
      Routes: <code>/invoice</code> and <code>/voucher</code>
    </div>
  </div>
</body>
</html>
